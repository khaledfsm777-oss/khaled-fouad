<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البنيان الرقمي للقرآن الكريم</title>
    <meta name="description" content="منظومة البنيان للتحليل الرقمي والاستقصاء المطور لحساب الجمل وتقسيم آيات القرآن الكريم" />
    <meta property="og:title" content="البنيان الرقمي للقرآن الكريم" />
    <meta property="og:description" content="منظومة البنيان للتحليل الرقمي والاستقصاء المطور لحساب الجمل وتقسيم آيات القرآن الكريم" />
    <meta name="theme-color" content="#092b22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="البنيان" />
    <meta name="author" content="الأستاذ الباحث خالد فؤاد السيد" />
    <meta name="copyright" content="جميع الحقوق محفوظة للباحث خالد فؤاد السيد ©" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <!-- Fonts are imported locally in index.css for full offline support -->
    <link rel="manifest" href="/manifest.json" />
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new Event('app-installable-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new Event('app-installed-done'));
      });

      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              // Ensure immediate update if worker script changed
              reg.update();
            })
            .catch(() => {});
        });
      }
    </script>
    <style>
      html, body {
        overscroll-behavior-y: contain;
      }
      body {
        font-family: 'Cairo', 'Space Grotesk', sans-serif;
        background-color: #FAF8F5;
        color: #1E293B;
      }
      .quran-font {
        font-family: 'Amiri', serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="bg-[#FAF8F5] text-[#1E293B] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
